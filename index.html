<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>S.A.Y.A.D. — Study Assistant for Your Academic Development</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0A0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="S.A.Y.A.D.">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('sayad_theme') || 'light';
        document.documentElement.dataset.theme = savedTheme;
        var savedProTheme = localStorage.getItem('sayad_pro_theme') || 'classic';
        document.documentElement.dataset.proTheme = savedProTheme;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          var c = '#EEF1EA';
          if (savedTheme === 'dark') c = '#0A0F14';
          else if (savedTheme === 'sepia') c = '#DECFAE';
          else if (savedTheme === 'oled') c = '#000000';
          metaTheme.setAttribute('content', c);
        }
      } catch(e) {}

      // Immediate Service Worker & beforeinstallprompt capture
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        console.log('[PWA Early] Captured beforeinstallprompt event!');
        if (window.onDeferredPromptReady && typeof window.onDeferredPromptReady === 'function') {
          window.onDeferredPromptReady(e);
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
      }
    })();
  </script>

  <link rel="stylesheet" href="/pdfjs/pdf_viewer.css">
  <script src="/pdfjs/pdf.min.js"></script>
  <!-- KaTeX is small and used for inline math, so it is loaded up front (from this origin). -->
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script>
    // Heavy libraries load on first use instead of blocking startup:
    //   await window.ensureLib('mermaid') | 'pdflib' | 'tesseract'
    (function () {
      var LIBS = {
        mermaid:   { global: 'mermaid',   urls: ['/vendor/mermaid.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js'] },
        pdflib:    { global: 'PDFLib',    urls: ['/vendor/pdf-lib.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'] },
        tesseract: { global: 'Tesseract', urls: ['https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js'] }
      };
      var pending = {};
      function inject(url) {
        return new Promise(function (resolve, reject) {
          var el = document.createElement('script');
          el.src = url;
          el.onload = function () { resolve(); };
          el.onerror = function () { el.remove(); reject(new Error('Failed to load ' + url)); };
          document.head.appendChild(el);
        });
      }
      window.ensureLib = function (name) {
        var lib = LIBS[name];
        if (!lib) return Promise.reject(new Error('Unknown library: ' + name));
        if (window[lib.global]) return Promise.resolve();
        if (pending[name]) return pending[name];
        pending[name] = lib.urls.reduce(function (chain, url) {
          return chain.catch(function () { return window[lib.global] ? undefined : inject(url); });
        }, Promise.reject(new Error('start'))).then(function () {
          if (!window[lib.global]) throw new Error(name + ' did not initialise');
        }).catch(function (err) { delete pending[name]; throw err; });
        return pending[name];
      };
    })();
  </script>
</head>
<body>

  <div id="root"></div>
  <div id="toast"></div>
  <div id="sel-toolbar"></div>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-fade-bottom" id="sheet-fade-bottom">
      <div class="sheet-scroll-hint">More options below ↓</div>
    </div>
    <div class="sheet-scroll-progress" id="sheet-scroll-progress">
      <div class="sheet-scroll-progress-bar" id="sheet-scroll-progress-bar"></div>
    </div>
  </div>
  <input type="file" id="file-input" accept=".pdf, application/pdf" multiple style="display:none">

  <!-- Core App Entrypoint (Bundles and compiles CSS/JS via Vite) -->
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
